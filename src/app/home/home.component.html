<div class="courses-panel">
  <h3>All Courses</h3>

  <button (click)="onAddCourse()" class="btn">Add Course</button>
  <button (click)="onToObservableExam()" class="btn">toObservable</button>

  <mat-tab-group>
    <mat-tab label="Beginners">
      <courses-card-list
        #beginnersList
        (courseDeleted)="onCourseDeletetd($event)"
        (courseUpdated)="onCourseUpdated($event)"
        [courses]="beginnerCourse()"
      />
    </mat-tab>

    <mat-tab label="Advanced">
      <courses-card-list
        (courseDeleted)="onCourseDeletetd($event)"
        (courseUpdated)="onCourseUpdated($event)"
        [courses]="advancedCourse()"
      />
    </mat-tab>
  </mat-tab-group>
</div>
